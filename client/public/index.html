<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6fc" />
    <meta
      name="description"
      content="АСУ учёта оборудования: реестр техники, заявки, ТО, перемещения и заказы"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      // Ставим тему до первой отрисовки, чтобы не мигало белым
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <style>
      html {
        background: #f7f6fc;
      }
      html[data-theme='dark'] {
        background: #0f0e17;
      }
    </style>
    <title>АСУ Оборудование</title>
  </head>
  <body>
    <noscript>Для работы приложения включите JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
